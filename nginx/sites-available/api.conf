# ─────────────────────────────────────────────────────────────────────────────
# Nginx Virtual Host Configuration — API Server (api.staging-domain.com)
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zone: 10MB state storage (~160,000 IPs), max 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ─── 1. HTTP Server (Port 80) — Redirect all traffic to HTTPS ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.staging-domain.com;
    server_tokens off;

    # Certbot ACME Challenge location for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 2. HTTPS Server (Port 443) — Reverse Proxy to PM2 API (127.0.0.1:3000) ─
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.staging-domain.com;
    server_tokens off;

    # TLS Certificate paths (Certbot automatically updates these)
    ssl_certificate /etc/letsencrypt/live/api.staging-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.staging-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum payload size for file uploads (e.g. AI menu PDF OCR & Cloudinary front-end links)
    client_max_body_size 20M;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # Log Locations
    access_log /var/log/nginx/api.access.log;
    error_log /var/log/nginx/api.error.log warn;

    # Main API Location
    location / {
        # Apply rate limiting: max burst 20, nodelay for smooth API response
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support WebSocket connection upgrades if needed in the future
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint bypass (no rate limit for internal / uptime monitoring)
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
}
