# ─────────────────────────────────────────────────────────────────────────────
# Nginx Virtual Host Configuration — n8n Automation Engine (n8n.staging-domain.com)
# ─────────────────────────────────────────────────────────────────────────────

# ─── 1. HTTP Server (Port 80) — Redirect all traffic to HTTPS ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name n8n.staging-domain.com;
    server_tokens off;

    # Certbot ACME Challenge location for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 2. HTTPS Server (Port 443) — Reverse Proxy to PM2 n8n (127.0.0.1:5678) ───
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8n.staging-domain.com;
    server_tokens off;

    # TLS Certificate paths (Certbot automatically updates these)
    ssl_certificate /etc/letsencrypt/live/n8n.staging-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.staging-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security & Protection Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Payload limits for bulk OCR workflow payloads
    client_max_body_size 50M;

    # Log Locations
    access_log /var/log/nginx/n8n.access.log;
    error_log /var/log/nginx/n8n.error.log warn;

    # ─── Access Control / IP Allowlist ──────────────────────────────────────
    # Restrict n8n UI access to authorized administrative IP addresses.
    # Replace with your actual admin IP address or comment out if using basic auth.
    allow YOUR_ADMIN_IP; # Admin IP
    deny all;

    # Main n8n Proxy Location
    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;

        # Mandatory WebSocket upgrade headers required for n8n execution canvas & UI logs
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable chunked transfer buffering for real-time workflow outputs
        proxy_buffering off;
        proxy_cache off;

        # Timeouts for long-running workflows (e.g. LLM menu OCR parsing)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
