# Redis Configuration
# Used for: session storage, rate limiting, distributed locks, idempotency keys, cached lookups
#
# This file is placed in infra/redis/redis.conf and referenced when starting Redis locally
# and on the VPS. Keep this version in sync between dev and production.

# ─── Network ──────────────────────────────────────────────────────────────────
bind 127.0.0.1
port 6379
protected-mode yes

# ─── Persistence ──────────────────────────────────────────────────────────────
# AOF (Append-Only File) — every write is durably logged.
# This means a Redis restart after a crash replays all commands, losing at most 1 second of writes.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshot — secondary, for faster full restores.
save 3600 1
save 300 100
save 60 10000

# ─── Memory ───────────────────────────────────────────────────────────────────
# Set to ~25% of VPS RAM. Adjust for your Hostinger plan.
maxmemory 256mb
# allkeys-lru: when maxmemory is reached, evict the least-recently-used keys.
# Preferred for cache use-case (sessions, rate limit counters are regenerated on miss).
maxmemory-policy allkeys-lru

# ─── Connection ───────────────────────────────────────────────────────────────
timeout 300
tcp-keepalive 60
maxclients 100

# ─── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/redis-server.log
